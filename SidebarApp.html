<!-- SidebarApp.html - Alpine.js application logic for Sidebar -->
<script>
  function sidebarApp() {
    return {
      // === STATE ===
      sheetsData: {},
      linkedQuestions: {},
      allQuestions: [],
      hiddenQuestionIds: new Set(),
      archivedQuestionIds: new Set(),
      currentView: 'list',
      sourceQuestion: null,
      searchTerm: '',
      facetListSearchTerm: '',
      manageSearchTerm: '',
      currentGroupName: '',
      pendingSelections: new Set(),
      
      // Facet state
      facetData: {
        groupName: null,
        questionId: null,
        values: [],
        pendingEdits: {},
        filterTerm: '',
        splitByComma: false,
        sortBy: 'alphabetical',
        previousView: 'list',
        isLoadingValues: false,
        countsLoaded: false,
        title: '',
        previousViewLabel: 'Tools',
        specificYear: null,
      },
      
      // Combine state
      combineData: {
        sheetName: '',
        headers: [],
        preselectedHeaders: null,
        idsToArchive: [],
      },
      
      // Preview state
      previewData: {},
      expandedPreviews: new Set(),
      loadingPreviews: new Set(),
      
      // UI state
      isLoading: true,
      loaderMessage: 'Initializing...',
      toast: { show: false, message: '', type: 'success' },
      draggedFacetItem: null,

      // === COMPUTED PROPERTIES ===
      
      get linkableItems() {
        const processedIds = new Set(Object.values(this.linkedQuestions).flat());
        const displayItems = [];
        
        for (const groupName in this.linkedQuestions) {
          const groupIds = this.linkedQuestions[groupName];
          if (!groupIds || groupIds.length === 0) continue;
          const rep = this.allQuestions.find(q => q && q.id && groupIds.includes(q.id) && 
            !this.hiddenQuestionIds.has(q.id) && !this.archivedQuestionIds.has(q.id));
          if (rep) {
            displayItems.push({ type: 'group', key: groupName, groupName, representativeQuestion: rep, questionCount: groupIds.length });
          }
        }

        this.allQuestions.forEach(q => {
          if (q && q.id && !processedIds.has(q.id) && !this.hiddenQuestionIds.has(q.id) && !this.archivedQuestionIds.has(q.id)) {
            displayItems.push({ type: 'single', key: q.id, groupName: null, representativeQuestion: q, questionCount: 1 });
          }
        });
        
        const sorted = displayItems.sort((a, b) => (a.groupName || a.representativeQuestion.question).localeCompare(b.groupName || b.representativeQuestion.question));
        
        if (!this.searchTerm) return sorted;
        const term = this.searchTerm.toLowerCase();
        return sorted.filter(item => 
          (item.groupName && item.groupName.toLowerCase().includes(term)) ||
          item.representativeQuestion.question.toLowerCase().includes(term)
        );
      },

      get facetableItems() {
        const processedIds = new Set(Object.values(this.linkedQuestions).flat());
        const displayItems = [];
        
        for (const groupName in this.linkedQuestions) {
          const groupIds = this.linkedQuestions[groupName];
          if (!groupIds || groupIds.length === 0) continue;
          const rep = this.allQuestions.find(q => q && q.id && groupIds.includes(q.id) && !this.archivedQuestionIds.has(q.id));
          if (rep) {
            displayItems.push({ type: 'group', key: groupName, groupName, representativeQuestion: rep, questionCount: groupIds.length });
          }
        }

        this.allQuestions.forEach(q => {
          if (q && q.id && !processedIds.has(q.id) && !this.archivedQuestionIds.has(q.id)) {
            displayItems.push({ type: 'single', key: q.id, groupName: null, representativeQuestion: q, questionCount: 1 });
          }
        });
        
        const sorted = displayItems.sort((a, b) => (a.groupName || a.representativeQuestion.question).localeCompare(b.groupName || b.representativeQuestion.question));
        
        if (!this.facetListSearchTerm) return sorted;
        const term = this.facetListSearchTerm.toLowerCase();
        return sorted.filter(item => 
          (item.groupName && item.groupName.toLowerCase().includes(term)) ||
          item.representativeQuestion.question.toLowerCase().includes(term)
        );
      },
      
      get filteredManageGroups() {
        const term = this.manageSearchTerm.toLowerCase();
        return Object.keys(this.linkedQuestions).filter(g => g.toLowerCase().includes(term)).sort();
      },
      
      get hiddenQuestions() {
        return this.allQuestions.filter(q => this.hiddenQuestionIds.has(q.id)).sort((a, b) => a.question.localeCompare(b.question));
      },
      
      get archivedQuestions() {
        return this.allQuestions.filter(q => this.archivedQuestionIds.has(q.id)).sort((a, b) => a.question.localeCompare(b.question));
      },
      
      get pendingSelectionsInSheets() {
        const selectedBySheet = {};
        this.pendingSelections.forEach(id => {
          const question = this.allQuestions.find(q => q.id === id);
          if (question) {
            if (!selectedBySheet[question.sheet]) selectedBySheet[question.sheet] = [];
            selectedBySheet[question.sheet].push(question);
          }
        });
        return Object.entries(selectedBySheet).sort((a, b) => a[0].localeCompare(b[0])).map(([name, questions]) => ({ name, questions }));
      },
      
      get filteredFacetValues() {
        const sorted = [...this.facetData.values].sort((a, b) => {
          if (this.facetData.sortBy === 'count' && this.facetData.countsLoaded) {
            return (b.count || 0) - (a.count || 0);
          }
          return a.text.localeCompare(b.text, undefined, { numeric: true });
        });
        
        if (!this.facetData.filterTerm) return sorted;
        const term = this.facetData.filterTerm.toLowerCase();
        return sorted.filter(v => {
          const displayText = this.facetData.pendingEdits.hasOwnProperty(v.text) ? this.facetData.pendingEdits[v.text] : v.text;
          return displayText.toLowerCase().includes(term);
        });
      },

      // === METHODS ===
      
      async initialize() {
        this.isLoading = true;
        try {
          this.loaderMessage = "Step 1/2: Verifying question IDs...";
          await server.ensureQuestionIdsExist();
          
          this.loaderMessage = "Step 2/2: Loading data...";
          const [sheets, links, hidden, archived] = await server.getSidebarInitialData();
          
          this.sheetsData = sheets;
          this.linkedQuestions = JSON.parse(links);
          this.hiddenQuestionIds = new Set(JSON.parse(hidden || '[]'));
          this.archivedQuestionIds = new Set(JSON.parse(archived || '[]'));
          this.allQuestions = Object.values(sheets).flat();
          this.currentView = 'list';
        } catch (e) {
          this.handleError(e);
        } finally {
          this.isLoading = false;
        }
      },

      // Utility methods
      findGroupForQuestion(questionId) {
        return Object.keys(this.linkedQuestions).find(group => this.linkedQuestions[group].includes(questionId));
      },
      
      getRelatedQuestionIds(sourceQuestionId) {
        const sourceQuestion = this.allQuestions.find(q => q.id === sourceQuestionId);
        if (!sourceQuestion) return [sourceQuestionId];
        const baseText = sourceQuestion.question.split('[')[0].trim();
        return this.allQuestions.filter(q => q.sheet === sourceQuestion.sheet && q.question.split('[')[0].trim() === baseText).map(q => q.id);
      },

      showLoader(isLoading, message = '') {
        this.isLoading = isLoading;
        this.loaderMessage = message;
      },

      handleError(error) {
        console.error(error);
        this.showLoader(false);
        this.loadingPreviews.clear();
        this.showToast(`Error: ${error.message}`, 'error');
      },

      showToast(message, type = 'success') {
        this.toast = { show: true, message, type };
        setTimeout(() => this.toast.show = false, 3000);
      },
      
      filterQuestionsForLinking(sheetName) {
        return (this.sheetsData[sheetName] || []).filter(q => 
          !this.hiddenQuestionIds.has(q.id) && 
          !this.archivedQuestionIds.has(q.id) &&
          q.question.toLowerCase().includes(this.searchTerm.toLowerCase())
        );
      },

      // Linking handlers
      startLinking(questionId) {
        const sourceQuestion = this.allQuestions.find(q => q.id === questionId);
        if (!sourceQuestion) return;

        this.sourceQuestion = sourceQuestion;
        this.currentView = 'linking';
        this.searchTerm = '';
        this.currentGroupName = '';

        const baseText = sourceQuestion.question.split('[')[0].trim();
        const similarIds = this.allQuestions.filter(q => q.sheet === sourceQuestion.sheet && q.question.split('[')[0].trim() === baseText).map(q => q.id);
        this.pendingSelections = new Set(similarIds);
      },

      startEditingGroup(groupName) {
        const groupIds = this.linkedQuestions[groupName];
        if (!groupIds || groupIds.length === 0) return this.showToast('Group is empty or invalid.', 'error');
        
        this.sourceQuestion = this.allQuestions.find(q => q.id === groupIds[0]) || { id: groupIds[0], question: 'N/A', sheet: 'N/A' };
        this.currentView = 'linking';
        this.pendingSelections = new Set(groupIds);
        this.currentGroupName = groupName;
      },

      handleCheckboxToggle(e) {
        const questionId = e.target.value;
        const isChecked = e.target.checked;
        const idsToToggle = e.shiftKey ? [questionId] : this.getRelatedQuestionIds(questionId);
        idsToToggle.forEach(id => isChecked ? this.pendingSelections.add(id) : this.pendingSelections.delete(id));
        this.pendingSelections = new Set(this.pendingSelections);
      },
      
      handleRemoveSelection(idToRemove) {
        this.getRelatedQuestionIds(idToRemove).forEach(id => this.pendingSelections.delete(id));
        this.pendingSelections = new Set(this.pendingSelections);
      },

      handleClearSelections() {
        if (this.pendingSelections.size === 0) return;
        this.pendingSelections.clear();
        this.pendingSelections = new Set(this.pendingSelections);
        this.showToast('All selections cleared.');
      },

      async handleSave() {
        const label = this.currentGroupName.trim();
        if (!label) return this.showToast('Please provide a group label.', 'error');
        
        const selectedIds = Array.from(this.pendingSelections);
        const oldGroupName = this.findGroupForQuestion(this.sourceQuestion.id);

        if (oldGroupName && oldGroupName !== label) delete this.linkedQuestions[oldGroupName];
        
        Object.keys(this.linkedQuestions).forEach(group => {
          this.linkedQuestions[group] = this.linkedQuestions[group].filter(id => !selectedIds.includes(id));
          if (this.linkedQuestions[group].length === 0) delete this.linkedQuestions[group];
        });
        
        if (selectedIds.length > 0) this.linkedQuestions[label] = selectedIds.sort();
        else delete this.linkedQuestions[label];

        this.showLoader(true, 'Saving...');
        try {
          await server.saveLinks(JSON.stringify(this.linkedQuestions));
          this.showToast('Group saved!');
          this.currentView = 'list';
          this.initialize();
        } catch (e) { this.handleError(e); }
        finally { this.showLoader(false); }
      },

      async handleDeleteGroup(e) {
        const btn = e.target;
        const groupName = this.currentGroupName || this.findGroupForQuestion(this.sourceQuestion.id);

        if (btn.textContent.includes('Confirm')) {
          delete this.linkedQuestions[groupName];
          this.showLoader(true, 'Deleting group...');
          try {
            await server.saveLinks(JSON.stringify(this.linkedQuestions));
            this.showToast('Group deleted!');
            this.currentView = 'list';
            this.initialize();
          } catch (e) { this.handleError(e); }
          finally { this.showLoader(false); }
        } else {
          const originalText = btn.textContent;
          btn.textContent = 'Confirm Delete?';
          btn.classList.add('text-error', 'font-bold');
          setTimeout(() => { if (btn) { btn.textContent = originalText; btn.classList.remove('text-error', 'font-bold'); } }, 3000);
        }
      },

      // Hidden/Archived handlers
      async handleHideQuestion(id) {
        this.hiddenQuestionIds.add(id);
        this.hiddenQuestionIds = new Set(this.hiddenQuestionIds);
        try {
          await server.saveHiddenQuestions(JSON.stringify(Array.from(this.hiddenQuestionIds)));
        } catch (e) { this.handleError(e); }
      },

      async handleUnhideQuestions() {
        const selectedIds = Array.from(document.querySelectorAll('.unhide-checkbox:checked')).map(cb => cb.dataset.id);
        if (selectedIds.length === 0) return this.showToast('Please select questions to unhide.', 'error');
        
        selectedIds.forEach(id => this.hiddenQuestionIds.delete(id));
        this.showLoader(true, 'Unhiding...');
        try {
          await server.saveHiddenQuestions(JSON.stringify(Array.from(this.hiddenQuestionIds)));
          this.showToast('Questions unhidden.');
          this.hiddenQuestionIds = new Set(this.hiddenQuestionIds);
        } catch (e) { this.handleError(e); }
        finally { this.showLoader(false); }
      },
      
      async handleArchiveQuestions() {
        const selectedIds = Array.from(document.querySelectorAll('.unhide-checkbox:checked')).map(cb => cb.dataset.id);
        if (selectedIds.length === 0) return this.showToast('Please select questions to archive.', 'error');
        
        selectedIds.forEach(id => { this.hiddenQuestionIds.delete(id); this.archivedQuestionIds.add(id); });
        this.showLoader(true, 'Archiving...');
        try {
          await server.saveHiddenAndArchivedQuestions(JSON.stringify(Array.from(this.hiddenQuestionIds)), JSON.stringify(Array.from(this.archivedQuestionIds)));
          this.showToast('Questions archived.');
          this.hiddenQuestionIds = new Set(this.hiddenQuestionIds);
          this.archivedQuestionIds = new Set(this.archivedQuestionIds);
        } catch (e) { this.handleError(e); }
        finally { this.showLoader(false); }
      },
      
      async handleUnhideFromArchive() {
        const selectedIds = Array.from(document.querySelectorAll('.unarchive-checkbox:checked')).map(cb => cb.dataset.id);
        if (selectedIds.length === 0) return this.showToast('Please select questions.', 'error');
        
        selectedIds.forEach(id => { this.archivedQuestionIds.delete(id); this.hiddenQuestionIds.add(id); });
        this.showLoader(true, 'Moving to Hidden...');
        try {
          await server.saveHiddenAndArchivedQuestions(JSON.stringify(Array.from(this.hiddenQuestionIds)), JSON.stringify(Array.from(this.archivedQuestionIds)));
          this.showToast('Questions moved to Hidden.');
          this.hiddenQuestionIds = new Set(this.hiddenQuestionIds);
          this.archivedQuestionIds = new Set(this.archivedQuestionIds);
        } catch (e) { this.handleError(e); }
        finally { this.showLoader(false); }
      },

      async handleHideChecked() {
        const checkedIds = Array.from(this.pendingSelections);
        if (checkedIds.length === 0) return this.showToast('No questions selected.', 'error');

        checkedIds.forEach(id => { this.hiddenQuestionIds.add(id); this.pendingSelections.delete(id); });
        
        this.showLoader(true, 'Hiding...');
        try {
          await server.saveHiddenQuestions(JSON.stringify(Array.from(this.hiddenQuestionIds)));
          this.showToast(`${checkedIds.length} question(s) hidden.`);
          this.hiddenQuestionIds = new Set(this.hiddenQuestionIds);
          this.pendingSelections = new Set(this.pendingSelections);
          this.currentView = 'allQuestions';
        } catch (e) { this.handleError(e); }
        finally { this.showLoader(false); }
      },

      // Group management handlers
      async handleUnlinkAll(e) {
        const btn = e.target;
        if (btn.textContent.includes('Confirm')) {
          this.linkedQuestions = {};
          this.showLoader(true, 'Unlinking all...');
          try {
            await server.saveLinks(JSON.stringify(this.linkedQuestions));
            this.showToast('All groups unlinked.');
            this.manageSearchTerm = '';
          } catch (e) { this.handleError(e); }
          finally { this.showLoader(false); }
        } else {
          const originalText = btn.textContent;
          btn.textContent = 'Confirm Unlink All?';
          btn.classList.add('bg-red-900');
          setTimeout(() => { if (btn) { btn.textContent = originalText; btn.classList.remove('bg-red-900'); } }, 3000);
        }
      },

      async handleMassUnlink(e) {
        const btn = e.target;
        const selectedGroups = Array.from(document.querySelectorAll('.unlink-checkbox:checked')).map(cb => cb.dataset.group);
        if (selectedGroups.length === 0) return this.showToast('Please select groups.', 'error');

        if (btn.textContent.includes('Confirm')) {
          selectedGroups.forEach(g => delete this.linkedQuestions[g]);
          this.showLoader(true, 'Unlinking...');
          try {
            await server.saveLinks(JSON.stringify(this.linkedQuestions));
            this.showToast('Groups unlinked!');
            this.manageSearchTerm = '';
            document.querySelectorAll('.unlink-checkbox:checked').forEach(cb => cb.checked = false);
          } catch (e) { this.handleError(e); }
          finally { this.showLoader(false); }
        } else {
          const originalText = btn.textContent;
          btn.textContent = `Confirm Unlink (${selectedGroups.length})?`;
          btn.classList.add('bg-red-700');
          setTimeout(() => { if (btn) { btn.textContent = originalText; btn.classList.remove('bg-red-700'); } }, 3000);
        }
      },

      async handleForceResync() {
        const allKnownIds = new Set(this.allQuestions.map(q => q.id));
        const originalLinks = JSON.parse(JSON.stringify(this.linkedQuestions));
        const cleanedLinks = {};
        const seenIds = new Set();
        
        for (const groupName in originalLinks) {
          if (!Array.isArray(originalLinks[groupName])) continue;
          const validIds = [];
          for (const id of originalLinks[groupName]) {
            if (allKnownIds.has(id) && !seenIds.has(id)) {
              validIds.push(id);
              seenIds.add(id);
            }
          }
          if (validIds.length > 0) cleanedLinks[groupName] = validIds.sort();
        }
        
        if (JSON.stringify(originalLinks) === JSON.stringify(cleanedLinks)) {
          return this.showToast('Re-sync complete. No issues found!');
        }

        this.linkedQuestions = cleanedLinks;
        this.showLoader(true, 'Saving...');
        try {
          await server.saveLinks(JSON.stringify(this.linkedQuestions));
          this.showToast('Data re-synced!');
          this.initialize();
        } catch (e) { this.handleError(e); }
      },

      // Facet handlers
      async startFacetedEditing(groupName, questionId, splitByComma = false, specificYear = null) {
        this.facetData.pendingEdits = {};
        this.facetData.groupName = groupName;
        this.facetData.questionId = questionId;
        this.facetData.splitByComma = splitByComma;
        this.facetData.values = [];
        this.facetData.countsLoaded = false;
        this.facetData.isLoadingValues = true;
        this.facetData.specificYear = specificYear;
        
        if (this.currentView !== 'facet') {
          this.facetData.previousView = this.currentView;
          this.facetData.previousViewLabel = { list: 'Tools', linking: 'Link Questions', manage: 'Manage Groups' }[this.currentView] || 'Tools';
        }

        if (specificYear) {
          const q = this.allQuestions.find(q => q.id === questionId);
          this.facetData.title = groupName ? `Text Facet: ${groupName} (${specificYear})` : `Text Facet: ${q ? q.question : 'Column'} (${specificYear})`;
        } else {
          this.facetData.title = groupName ? `Text Facet: ${groupName}` : `Text Facet: ${this.allQuestions.find(q => q.id === questionId)?.question || 'Column'}`;
        }

        this.currentView = 'facet';

        try {
          const result = await server.getFacetData({ groupName, questionId, splitByComma, specificYear });
          this.facetData.values = result.uniqueValues.map(val => ({ text: val, count: null }));
          this.facetData.isLoadingValues = false;

          const countMap = new Map(result.valueCounts.map(item => [item.text, item.count]));
          this.facetData.values.forEach(item => item.count = countMap.get(item.text) || 0);
          this.facetData.countsLoaded = true;
        } catch (e) {
          this.handleError(e);
          this.facetData.isLoadingValues = false;
        }
      },

      handleFacetCheckboxToggle() {
        this.startFacetedEditing(this.facetData.groupName, this.facetData.questionId, this.facetData.splitByComma, this.facetData.specificYear);
      },

      handleDirectEdit(originalValue, newValue) {
        if (newValue.trim() === originalValue) {
          delete this.facetData.pendingEdits[originalValue];
        } else {
          this.facetData.pendingEdits[originalValue] = newValue.trim();
        }
        this.facetData.pendingEdits = { ...this.facetData.pendingEdits };
      },
      
      handleCaseChange(originalValue, caseType) {
        const currentValue = this.facetData.pendingEdits[originalValue] || originalValue;
        let newValue;
        if (caseType === 'upper') newValue = currentValue.toUpperCase();
        else if (caseType === 'sentence') newValue = toSentenceCase(currentValue);
        else if (caseType === 'capital') newValue = toCapitalCase(currentValue);
        
        if (newValue !== originalValue) this.facetData.pendingEdits[originalValue] = newValue;
        else delete this.facetData.pendingEdits[originalValue];
        this.facetData.pendingEdits = { ...this.facetData.pendingEdits };
      },
      
      handleRevertEdit(originalValue) {
        delete this.facetData.pendingEdits[originalValue];
        this.facetData.pendingEdits = { ...this.facetData.pendingEdits };
      },
      
      handleMassCaseChange(caseType) {
        if (this.facetData.isLoadingValues) return;
        
        const newEdits = { ...this.facetData.pendingEdits };
        this.facetData.values.forEach(item => {
          const originalValue = item.text;
          const currentValue = newEdits.hasOwnProperty(originalValue) ? newEdits[originalValue] : originalValue;
          if (!currentValue) return;

          let newValue = caseType === 'sentence' ? toSentenceCase(currentValue) : toCapitalCase(currentValue);
          
          if (newValue.trim() === originalValue) delete newEdits[originalValue];
          else newEdits[originalValue] = newValue.trim();
        });
        
        this.facetData.pendingEdits = newEdits;
        this.showToast(`All values queued for ${caseType} case.`);
      },
      
      async handleApplyAllFacetChanges() {
        const edits = Object.entries(this.facetData.pendingEdits).map(([from, to]) => ({ from, to }));
        if (edits.length === 0) return;

        const findReplace = {};
        edits.forEach(e => findReplace[e.from] = e.to);

        this.showLoader(true, 'Applying changes...');
        try {
          const response = await server.applyMassEdit({
            groupName: this.facetData.groupName,
            questionId: this.facetData.groupName ? null : this.facetData.questionId,
            findReplace,
            splitByComma: this.facetData.splitByComma,
            specificYear: this.facetData.specificYear
          });
          
          if (response.success) {
            this.showToast(response.message);
            this.startFacetedEditing(this.facetData.groupName, this.facetData.questionId, this.facetData.splitByComma, this.facetData.specificYear);
          } else {
            this.handleError(new Error(response.message));
          }
        } catch (e) { this.handleError(e); }
        finally { this.showLoader(false); }
      },
      
      handleFacetBack(event) {
        const hasEdits = Object.keys(this.facetData.pendingEdits).length > 0;
        
        if (!hasEdits) {
          this.currentView = this.facetData.previousView || 'list';
          return;
        }

        const btn = event.currentTarget;
        const originalHtml = btn.innerHTML;

        if (btn.dataset.confirm === 'true') {
          this.currentView = this.facetData.previousView || 'list';
        } else {
          btn.innerHTML = 'Unsaved changes. Click again to exit.';
          btn.dataset.confirm = 'true';
          btn.classList.add('text-error');
          setTimeout(() => {
            if (btn && btn.dataset.confirm === 'true') {
              btn.innerHTML = originalHtml;
              btn.dataset.confirm = 'false';
              btn.classList.remove('text-error');
            }
          }, 3000);
        }
      },

      // Drag and drop
      handleFacetDragStart(event, originalValue) {
        this.draggedFacetItem = originalValue;
        event.dataTransfer.setData('text/plain', originalValue);
        event.dataTransfer.effectAllowed = 'move';
        event.target.closest('.facet-item').classList.add('is-dragging');
      },
      
      handleFacetDrop(event, targetOriginalValue) {
        event.target.closest('.facet-item').classList.remove('drag-over-target');
        const draggedOriginalValue = event.dataTransfer.getData('text/plain');
        if (!draggedOriginalValue || draggedOriginalValue === targetOriginalValue) return;
        const targetNewValue = this.facetData.pendingEdits[targetOriginalValue] || targetOriginalValue;
        this.handleDirectEdit(draggedOriginalValue, targetNewValue);
      },

      // Combine handlers
      async handleCombineWithSelection() {
        const selections = this.getSelectionsForCombine();
        if (!selections) return;
        
        this.showLoader(true, `Switching to ${selections.targetSheet}...`);
        try {
          await server.setActiveSheet(selections.targetSheet);
          // Would switch to combine view - simplified for this refactor
          this.showToast('Ready to combine. Feature simplified.');
        } catch (e) { this.handleError(e); }
        finally { this.showLoader(false); }
      },
      
      async handleCombineSingleChoice() {
        const selections = this.getSelectionsForCombine();
        if (!selections) return;
        if (selections.selectedHeaders.length !== 2) {
          return this.showToast('Please select exactly two columns.', 'error');
        }

        this.showLoader(true, 'Combining...');
        try {
          const response = await server.combineSingleChoiceColumns({
            selectedHeaders: selections.selectedHeaders,
            sheetName: selections.targetSheet,
            idsToArchive: selections.selectedIds
          });
          if (response.success) {
            this.showToast(response.message);
            this.initialize();
          } else {
            this.handleError(new Error(response.message));
          }
        } catch (e) { this.handleError(e); }
        finally { this.showLoader(false); }
      },

      getSelectionsForCombine() {
        const checkedIds = Array.from(this.pendingSelections);
        if (checkedIds.length === 0) {
          this.showToast('Please select columns.', 'error');
          return null;
        }
        
        const selectionsBySheet = {};
        checkedIds.forEach(id => {
          const question = this.allQuestions.find(q => q.id === id);
          if (question) {
            if (!selectionsBySheet[question.sheet]) selectionsBySheet[question.sheet] = [];
            selectionsBySheet[question.sheet].push(id);
          }
        });

        const sheets = Object.keys(selectionsBySheet);
        if (sheets.length > 1) {
          this.showToast('Select columns from one sheet only.', 'error');
          return null;
        }
        
        const targetSheet = sheets[0];
        const selectedIds = selectionsBySheet[targetSheet];
        const selectedHeaders = selectedIds.map(id => this.allQuestions.find(q => q.id === id)?.question).filter(Boolean);
        return { targetSheet, selectedHeaders, selectedIds };
      },
    };
  }
</script>
