<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
  
  <!-- Include shared styles -->
  <?!= HtmlService.createHtmlOutputFromFile('SharedStyles').getContent(); ?>
  
  <style>
    .duplicate-card { transition: all 0.2s; }
    .duplicate-card:hover { box-shadow: var(--shadow); }
    .occurrence-row { border-left: 3px solid transparent; transition: border-color 0.2s; }
    .occurrence-row:hover { border-left-color: var(--primary); }
    .occurrence-row.selected { background-color: var(--primary-light); border-left-color: var(--primary); }
  </style>
</head>
<body class="p-6">
  <!-- Include shared utilities -->
  <?!= HtmlService.createHtmlOutputFromFile('SharedUtils').getContent(); ?>

  <div id="app" x-data="duplicateCleanerApp()" x-init="initialize()" x-cloak>
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-xl font-bold">Duplicate Configuration Manager</h1>
        <p class="text-sm text-secondary">Find and resolve duplicate question IDs in the configuration sheet</p>
      </div>
      <button @click="initialize()" class="btn btn-secondary">
        ↻ Refresh
      </button>
    </div>

    <!-- Summary -->
    <div class="card mb-6">
      <div class="card-body">
        <div class="flex items-center gap-6">
          <div>
            <div class="text-2xl font-bold" x-text="duplicateCount"></div>
            <div class="text-sm text-secondary">Duplicate IDs Found</div>
          </div>
          <div>
            <div class="text-2xl font-bold" x-text="totalOccurrences"></div>
            <div class="text-sm text-secondary">Total Occurrences</div>
          </div>
          <div class="flex-1"></div>
          <template x-if="duplicateCount > 0">
            <button @click="handleDeleteAllDuplicates($event)" class="btn btn-danger">
              Delete All Duplicates (Keep First)
            </button>
          </template>
        </div>
      </div>
    </div>

    <!-- No Duplicates Message -->
    <template x-if="duplicateCount === 0 && !isLoading">
      <div class="card">
        <div class="card-body text-center py-12">
          <div class="text-4xl mb-4">✅</div>
          <h2 class="font-bold text-lg mb-2">No Duplicates Found</h2>
          <p class="text-secondary">Your configuration sheet has no duplicate question IDs.</p>
        </div>
      </div>
    </template>

    <!-- Duplicate List -->
    <div class="space-y-4">
      <template x-for="(occurrences, questionId) in duplicates" :key="questionId">
        <div class="duplicate-card card">
          <div class="card-header flex justify-between items-center">
            <div>
              <span class="font-bold" x-text="questionId"></span>
              <span class="badge badge-warning ml-2" x-text="occurrences.length + ' occurrences'"></span>
            </div>
            <button @click="handleKeepFirst(questionId, occurrences)" class="btn btn-secondary btn-sm">
              Keep First Only
            </button>
          </div>
          
          <div class="card-body p-0">
            <table class="w-full text-sm">
              <thead>
                <tr class="bg-light">
                  <th class="p-2 text-left w-16">Row</th>
                  <template x-for="(header, i) in headers.slice(1)" :key="i">
                    <th class="p-2 text-left" x-text="header"></th>
                  </template>
                  <th class="p-2 text-left w-24">Actions</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(occurrence, index) in occurrences" :key="occurrence.rowNumber">
                  <tr class="occurrence-row border-t" :class="index === 0 ? 'selected' : ''">
                    <td class="p-2 font-mono text-xs" x-text="occurrence.rowNumber"></td>
                    <template x-for="(value, i) in occurrence.values.slice(1)" :key="i">
                      <td class="p-2 truncate max-w-xs" :title="value" x-text="value || '—'"></td>
                    </template>
                    <td class="p-2">
                      <div class="flex gap-1">
                        <button @click="handleDeleteRow(occurrence.rowNumber, questionId)" 
                                class="btn btn-danger btn-sm" title="Delete this row">
                          🗑️
                        </button>
                        <template x-if="index !== 0">
                          <button @click="handleKeepThis(occurrence.rowNumber, questionId, occurrences)"
                                  class="btn btn-secondary btn-sm" title="Keep this, delete others">
                            ✓
                          </button>
                        </template>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>
    </div>

    <!-- Loader -->
    <div x-show="isLoading" class="loader-overlay">
      <div class="spinner"></div>
      <p class="loader-message" x-text="loaderMessage"></p>
    </div>
    
    <!-- Toast -->
    <div x-show="toast.show" class="toast" :class="toast.type === 'success' ? 'toast-success' : 'toast-error'">
      <span x-text="toast.message"></span>
    </div>
  </div>

  <script>
    function duplicateCleanerApp() {
      return {
        headers: [],
        duplicates: {},
        
        isLoading: true,
        loaderMessage: 'Loading...',
        toast: { show: false, message: '', type: 'success' },

        get duplicateCount() {
          return Object.keys(this.duplicates).length;
        },
        
        get totalOccurrences() {
          return Object.values(this.duplicates).reduce((sum, arr) => sum + arr.length, 0);
        },

        async initialize() {
          this.isLoading = true;
          this.loaderMessage = 'Scanning for duplicates...';
          
          try {
            const result = await server.getConfigDuplicates();
            this.headers = result.headers || [];
            this.duplicates = result.duplicates || {};
            
            if (this.duplicateCount === 0) {
              this.showToast('No duplicates found');
            } else {
              this.showToast(`Found ${this.duplicateCount} duplicate IDs`);
            }
          } catch (e) {
            this.handleError(e);
          } finally {
            this.isLoading = false;
          }
        },

        async handleDeleteRow(rowNumber, questionId) {
          this.isLoading = true;
          this.loaderMessage = 'Deleting row...';
          
          try {
            await server.deleteConfigRow(rowNumber);
            
            // Remove from local state
            this.duplicates[questionId] = this.duplicates[questionId].filter(o => o.rowNumber !== rowNumber);
            
            // Update row numbers for remaining items (rows shift up)
            Object.values(this.duplicates).forEach(occurrences => {
              occurrences.forEach(o => {
                if (o.rowNumber > rowNumber) o.rowNumber--;
              });
            });
            
            // Remove from duplicates if only one left
            if (this.duplicates[questionId].length <= 1) {
              delete this.duplicates[questionId];
            }
            
            this.showToast('Row deleted');
          } catch (e) {
            this.handleError(e);
          } finally {
            this.isLoading = false;
          }
        },

        async handleKeepFirst(questionId, occurrences) {
          if (occurrences.length <= 1) return;
          
          // Delete all but the first (lowest row number)
          const sorted = [...occurrences].sort((a, b) => a.rowNumber - b.rowNumber);
          const toDelete = sorted.slice(1).map(o => o.rowNumber).sort((a, b) => b - a); // Delete from bottom up
          
          this.isLoading = true;
          this.loaderMessage = `Deleting ${toDelete.length} duplicate rows...`;
          
          try {
            for (const rowNum of toDelete) {
              await server.deleteConfigRow(rowNum);
            }
            
            delete this.duplicates[questionId];
            
            // Refresh to get accurate row numbers
            await this.initialize();
            
            this.showToast(`Kept first occurrence, deleted ${toDelete.length} duplicates`);
          } catch (e) {
            this.handleError(e);
          }
        },

        async handleKeepThis(keepRowNumber, questionId, occurrences) {
          const toDelete = occurrences
            .filter(o => o.rowNumber !== keepRowNumber)
            .map(o => o.rowNumber)
            .sort((a, b) => b - a); // Delete from bottom up
          
          this.isLoading = true;
          this.loaderMessage = `Deleting ${toDelete.length} rows...`;
          
          try {
            for (const rowNum of toDelete) {
              await server.deleteConfigRow(rowNum);
            }
            
            delete this.duplicates[questionId];
            
            // Refresh to get accurate row numbers
            await this.initialize();
            
            this.showToast(`Kept selected row, deleted ${toDelete.length} others`);
          } catch (e) {
            this.handleError(e);
          }
        },

        async handleDeleteAllDuplicates(event) {
          const btn = event.target;
          
          if (btn.dataset.confirm === 'true') {
            this.isLoading = true;
            this.loaderMessage = 'Deleting all duplicates...';
            
            try {
              let deletedCount = 0;
              
              for (const questionId in this.duplicates) {
                const occurrences = this.duplicates[questionId];
                const sorted = [...occurrences].sort((a, b) => a.rowNumber - b.rowNumber);
                const toDelete = sorted.slice(1).map(o => o.rowNumber).sort((a, b) => b - a);
                
                for (const rowNum of toDelete) {
                  await server.deleteConfigRow(rowNum);
                  deletedCount++;
                }
              }
              
              this.duplicates = {};
              await this.initialize();
              
              this.showToast(`Deleted ${deletedCount} duplicate rows`);
            } catch (e) {
              this.handleError(e);
            }
          } else {
            const originalText = btn.textContent;
            btn.textContent = 'Click again to confirm';
            btn.dataset.confirm = 'true';
            btn.classList.add('animate-pulse');
            
            setTimeout(() => {
              btn.textContent = originalText;
              btn.dataset.confirm = 'false';
              btn.classList.remove('animate-pulse');
            }, 3000);
          }
        },

        handleError(error) {
          console.error(error);
          this.isLoading = false;
          this.showToast(`Error: ${error.message}`, 'error');
        },

        showToast(message, type = 'success') {
          this.toast = { show: true, message, type };
          setTimeout(() => this.toast.show = false, 3000);
        }
      };
    }
  </script>
</body>
</html>
